const ENEMY_FIRE_INTERVAL := 2.0
const ENEMY_BLOCK_DAMAGE := 12.0

var gold := 100
var selected_part := "standard_cube"
var rotation_step := 0
var parts: Array[Dictionary] = []
var ship_root: Node3D
var camera: Camera3D
var status_label: Label
var enemy: MeshInstance3D
var enemy_hp := 500.0
var enemy_fire_timer := 0.0
var battle_mode := false
var placement_armed := false
var throttle := 0.0
var steering := 0.0
var ship_speed := 0.0
var yaw_speed := 0.0


func _ready() -> void:
	_make_world()
	_make_ui()
	_show_title()


func _make_world() -> void:
	var environment := WorldEnvironment.new()
	var env := Environment.new()
	env.background_mode = Environment.BG_COLOR
	env.background_color = Color(0.08, 0.13, 0.19)
	env.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
	env.ambient_light_color = Color(0.7, 0.75, 0.8)
	environment.environment = env
	add_child(environment)

	var sun := DirectionalLight3D.new()
	sun.rotation_degrees = Vector3(-55, -25, 0)
	add_child(sun)

	camera = Camera3D.new()
	camera.position = Vector3(0, 18, 22)
	camera.look_at(Vector3.ZERO)
	camera.current = true
	add_child(camera)


func _make_ui() -> void:
	var layer := CanvasLayer.new()
	add_child(layer)

	var root := Control.new()
	root.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
	layer.add_child(root)

	var title := Label.new()
	title.name = "Title"
	title.text = "BLOCK FLEET"
	title.add_theme_font_size_override("font_size", 42)
	title.position = Vector2(30, 20)
	root.add_child(title)

	status_label = Label.new()
	status_label.position = Vector2(30, 75)
	root.add_child(status_label)

	var start := Button.new()
	start.text = "Start Building"
	start.position = Vector2(30, 115)
	start.custom_minimum_size = Vector2(190, 55)
	root.add_child(start)
	start.pressed.connect(_start_building)

	var buttons := [
		["Place", _arm_placement],
		["Remove", _remove_selected],
		["Rotate Left", _rotate_left],
		["Rotate Right", _rotate_right],
		["Battle / Return", _toggle_battle],
		["Fire", _fire],
		["Forward", func(): throttle = 1.0],
		["Reverse", func(): throttle = -1.0],
		["Stop", func(): throttle = 0.0],
		["Steer Left", func(): steering = 1.0],
		["Steer Right", func(): steering = -1.0],
		["Straight", func(): steering = 0.0],
	]

	var y := 180.0
	for item in buttons:
		var button := Button.new()
		button.text = item[0]
		button.position = Vector2(30, y)
		button.custom_minimum_size = Vector2(160, 42)
		root.add_child(button)
		button.pressed.connect(item[1])
		y += 46.0

	var part_list := VBoxContainer.new()
	part_list.position = Vector2(220, 115)
	part_list.custom_minimum_size = Vector2(230, 600)
	root.add_child(part_list)

	for part_id in PARTS:
		var id: String = part_id
		var data: Dictionary = PARTS[id]
		var button := Button.new()
		button.text = "%s — %dg" % [data["label"], data["cost"]]
		part_list.add_child(button)
		button.pressed.connect(func(): _select_part(id))


func _show_title() -> void:
	battle_mode = false
	status_label.text = "Gold: %d   Select Start Building to begin." % gold


func _start_building() -> void:
	if ship_root == null:
		ship_root = Node3D.new()
		ship_root.name = "PlayerShip"
		add_child(ship_root)

	battle_mode = false
	_update_status()


func _select_part(part_id: String) -> void:
	selected_part = part_id
	_update_status()


func _arm_placement() -> void:
	if battle_mode or ship_root == null:
		return

	placement_armed = true
	status_label.text = "Tap or click the water to place %s." % PARTS[selected_part]["label"]


func _unhandled_input(event: InputEvent) -> void:
	if not placement_armed or battle_mode:
		return

	if event is InputEventScreenTouch and event.pressed:
		_place_selected_at(event.position)
	elif event is InputEventMouseButton \
	and event.button_index == MOUSE_BUTTON_LEFT \
	and event.pressed:
		_place_selected_at(event.position)


func _place_selected_at(screen_position: Vector2) -> void:
	if ship_root == null:
		return

	var data: Dictionary = PARTS[selected_part]
	var cost: int = data["cost"]

	if gold < cost:
		placement_armed = false
		status_label.text = "Not enough gold. Gold: %d" % gold
		return

	var point := _ground_point(screen_position)
	if point == Vector3.INF:
		return

	var size: Vector3 = data["size"]
	var position := Vector3(
		snappedf(point.x, 1.0),
		size.y * 0.5,
		snappedf(point.z, 1.0)
	)

	for existing in parts:
		if existing["node"].position.distance_to(position) < 0.2:
			return

	var body := StaticBody3D.new()
	body.position = position
	body.rotation.y = float(rotation_step) * PI / 2.0
	body.set_meta("part_id", selected_part)
	body.set_meta("hp", float(data.get("hp", 0.0)))
	body.set_meta("max_hp", float(data.get("hp", 0.0)))
	body.set_meta("flood", 0.0)
	body.set_meta("leak_rate", 0.0)
	body.set_meta("base_y", position.y)

	var mesh_instance := MeshInstance3D.new()
	var mesh := BoxMesh.new()
	mesh.size = size
	mesh_instance.mesh = mesh

	var material := StandardMaterial3D.new()
	material.albedo_color = data["color"]
	mesh_instance.material_override = material
	body.add_child(mesh_instance)

	var collision := CollisionShape3D.new()
	var shape := BoxShape3D.new()
	shape.size = size
	collision.shape = shape
	body.add_child(collision)

	ship_root.add_child(body)
	parts.append({"node": body, "data": data})
	gold -= cost
	placement_armed = false
	_update_status()


func _ground_point(screen_position: Vector2) -> Vector3:
	var origin := camera.project_ray_origin(screen_position)
	var direction := camera.project_ray_normal(screen_position)

	if absf(direction.y) < 0.001:
		return Vector3.INF

	var t := -origin.y / direction.y
	if t < 0.0:
		return Vector3.INF

	return origin + direction * t


func _remove_selected() -> void:
	if battle_mode or parts.is_empty():
		return

	var item: Dictionary = parts.pop_back()
	var node: Node3D = item["node"]
	var data: Dictionary = item["data"]
	gold += int(data["cost"] * 0.5)
	node.queue_free()
	_update_status()


func _rotate_left() -> void:
	rotation_step = (rotation_step + 3) % 4
	_update_status()


func _rotate_right() -> void:
	rotation_step = (rotation_step + 1) % 4
	_update_status()


func _toggle_battle() -> void:
	if ship_root == null:
		_start_building()

	battle_mode = not battle_mode
	placement_armed = false

	if battle_mode:
		_start_battle()
	else:
		if is_instance_valid(enemy):
			enemy.queue_free()
		enemy = null

	_update_status()


func _start_battle() -> void:
	enemy_hp = 500.0
	enemy_fire_timer = ENEMY_FIRE_INTERVAL

	enemy = MeshInstance3D.new()
	var mesh := BoxMesh.new()
	mesh.size = Vector3(4, 2, 6)
	enemy.mesh = mesh

	var material := StandardMaterial3D.new()
	material.albedo_color = Color(0.65, 0.18, 0.12)
	enemy.material_override = material
	enemy.position = Vector3(0, 1, -22)
	add_child(enemy)


func _fire() -> void:
	if not battle_mode or not is_instance_valid(enemy):
		return

	var damage := 0.0
	var underwater_guns := 0
	var working_guns := 0

	for item in parts:
		var data: Dictionary = item["data"]
		if data["kind"] != "weapon":
			continue

		var gun: Node3D = item["node"]
		if float(gun.get_meta("hp", 0.0)) <= 0.0:
			continue

		working_guns += 1
		var size: Vector3 = data["size"]

		# The waterline is y = 0. The tolerance permits guns placed
		# exactly at the waterline to fire.
		if gun.global_position.y - size.y * 0.5 < -0.01:
			underwater_guns += 1
			continue

		damage += float(data["damage"])

	if damage <= 0.0:
		if underwater_guns > 0:
			status_label.text = "Your guns are underwater and cannot fire."
		elif working_guns > 0:
			status_label.text = "No working guns remain."
		else:
			status_label.text = "Build a deck gun before battling."
		return

	enemy_hp -= damage
	if enemy_hp <= 0.0:
		enemy.queue_free()
		enemy = null
		gold += 50
		status_label.text = "Enemy defeated! +50 gold."
	else:
		status_label.text = "Hit for %.0f damage. Enemy HP: %.0f" % [damage, enemy_hp]


func _damage_random_hull_block(amount: float) -> void:
	var damageable_parts: Array[Dictionary] = []

	for item in parts:
		var data: Dictionary = item["data"]
		if data["kind"] != "hull" and data["kind"] != "weapon":
			continue

		var part: Node3D = item["node"]
		if float(part.get_meta("hp", 0.0)) > 0.0:
			damageable_parts.append(item)

	if damageable_parts.is_empty():
		status_label.text = "No hull blocks or guns remain!"
		return

	var item: Dictionary = damageable_parts.pick_random()
	var data: Dictionary = item["data"]
	var part: Node3D = item["node"]
	var hp := float(part.get_meta("hp")) - amount
	part.set_meta("hp", maxf(hp, 0.0))

	# Hull blocks leak when hit. Weapons take damage but do not flood or sink.
	if data["kind"] == "hull":
		var leak_rate := float(part.get_meta("leak_rate", 0.0))
		part.set_meta("leak_rate", minf(leak_rate + 0.15, 0.6))

	if hp <= 0.0:
		parts.erase(item)
		part.queue_free()
		status_label.text = "%s destroyed!" % data["label"]
	else:
		status_label.text = "%s hit: %.0f HP remaining." % [data["label"], hp]

	_update_status()


func _process(delta: float) -> void:
	if not battle_mode or ship_root == null:
		return

	if is_instance_valid(enemy):
		enemy_fire_timer -= delta
		if enemy_fire_timer <= 0.0:
			enemy_fire_timer = ENEMY_FIRE_INTERVAL
			_damage_random_hull_block(ENEMY_BLOCK_DAMAGE)

	# Flooding is limited to hull blocks. They remain attached and sink
	# gradually while gaining water weight.
	for item in parts:
		var data: Dictionary = item["data"]
		if data["kind"] != "hull":
			continue

		var block: Node3D = item["node"]
		var leak_rate := float(block.get_meta("leak_rate", 0.0))
		if leak_rate <= 0.0:
			continue

		var flood := minf(
			float(block.get_meta("flood", 0.0)) + leak_rate * delta,
			1.0
		)
		block.set_meta("flood", flood)
		block.position.y = float(block.get_meta("base_y")) - flood * 0.5

	var has_engine := false
	var power := 0.0
	var prop_capacity := 0.0
	var rudders := 0

	for item in parts:
		var data: Dictionary = item["data"]
		match data["kind"]:
			"engine":
				has_engine = true
				power += float(data["power"])
			"propeller":
				prop_capacity += float(data["capacity"])
			"rudder":
				rudders += 1

	var effective_power := minf(power, prop_capacity)
	if has_engine and prop_capacity > 0.0:
		ship_speed += throttle * effective_power * 0.002 * delta
	else:
		ship_speed = move_toward(ship_speed, 0.0, delta)

	ship_speed = clampf(ship_speed, -4.0, 12.0)

	var speed_factor := clampf(absf(ship_speed) / 12.0, 0.0, 1.0)
	yaw_speed = steering * float(rudders) * speed_factor * 0.8
	ship_root.rotate_y(yaw_speed * delta)
	ship_root.position += -ship_root.global_basis.z * ship_speed * delta

	camera.position.x = lerpf(camera.position.x, ship_root.position.x, delta * 2.0)
	camera.position.z = lerpf(camera.position.z, ship_root.position.z + 22.0, delta * 2.0)
	camera.look_at(ship_root.position)


func _update_status() -> void:
	var hull_hp := 0.0
	var power := 0.0
	var capacity := 0.0
	var weight := 0.0

	for item in parts:
		var data: Dictionary = item["data"]
		var node: Node3D = item["node"]

		if data["kind"] == "hull":
			hull_hp += float(node.get_meta("hp", 0.0))
			weight += float(node.get_meta("flood", 0.0)) * 3.0

		weight += float(data.get("weight", 0.0))

		if data["kind"] == "engine":
			power += float(data["power"])
		elif data["kind"] == "propeller":
			capacity += float(data["capacity"])

	status_label.text = "Gold: %d | Part: %s | Rotation: %d° | Hull HP: %.0f | Weight: %.1f | Power/prop: %.0f/%.0f" % [
		gold,
		PARTS[selected_part]["label"],
		rotation_step * 90,
		hull_hp,
		weight,
		power,
		capacity
	]
